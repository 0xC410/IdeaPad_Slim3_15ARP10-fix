# Prevents Realtek RTL8852BE queue flush timeouts ("timed out to flush queues") and AMD-Vi IO_PAGE_FAULTs
# during normal runtime. Note: do NOT set rtw89_core disable_ps_mode=y if it interferes with s2idle;
# the sleep/shutdown hooks also cleanly unload rtw89 before suspend, reboot, and poweroff.
options rtw89_pci disable_aspm_l1=y disable_aspm_l1ss=y
